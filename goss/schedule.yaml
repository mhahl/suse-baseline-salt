# Goss tests for baseline.schedule
#
# schedule.present persists jobs to the minion drop-in
# /etc/salt/minion.d/_schedule.conf, which is what these checks read.
# Overstate surfaces the same jobs in its Schedules tab via schedule.list.
# The nightly highstate uses a cron expression, which needs the croniter
# module (python313-croniter) on the minion.

package:
  python313-croniter:
    installed: true
    title: "croniter module for cron schedules is installed"

file:
  /etc/salt/minion.d/_schedule.conf:
    exists: true
    mode: "0644"
    owner: root
    group: root
    contents:
      - "mine-update-hourly"
      - "mine.update"
      - "highstate-nightly"
      - "state.highstate"
      - "17 2 \\* \\* \\*"
      - "trivy-cve-scan"
      - "trivy_scan.publish"
    title: "mine, highstate and trivy schedules are present"
