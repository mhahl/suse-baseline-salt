# Goss tests for baseline.systemd-resolved

package:
  systemd-resolved:
    installed: true
    title: "systemd-resolved package is installed"

file:
  /etc/systemd/resolved.conf:
    exists: true
    mode: "0644"
    contents:
      - "DNSOverTLS=yes"
      - "DNSSEC=yes"
      - "FallbackDNS="
      - "DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net"
    title: "systemd-resolved uses DNS-over-TLS + DNSSEC"

  /etc/resolv.conf:
    exists: true
