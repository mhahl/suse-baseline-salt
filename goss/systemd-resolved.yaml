# Goss tests for baseline.systemd-resolved

package:
  # NOTE: the split systemd-resolved package exists only on 16+; on 15.x
  # the resolver ships in monolithic `systemd` (see map.jinja), which is
  # present on every SUSE host, so assert that instead.
  systemd:
    installed: true
    title: "systemd base package is installed"

file:
  /etc/systemd/resolved.conf:
    exists: true
    mode: "0644"
    contents:
      - "DNSOverTLS=yes"
      - "DNSSEC=yes"
      - "FallbackDNS="
      - "DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net"
    title: "systemd-resolved uses DNS-over-TLS + DNSSEC"

  /etc/resolv.conf:
    exists: true
    linked-to: /run/systemd/resolve/stub-resolv.conf
    title: "resolv.conf points at the systemd-resolved stub"
