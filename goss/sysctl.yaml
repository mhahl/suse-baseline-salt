# Goss tests for baseline.sysctl
# Verifies the drop-in exists with key kernel and network-hardening values.

file:
  /etc/sysctl.d/99-baseline.conf:
    exists: true
    mode: "0644"
    owner: root
    group: root
    contents:
      - "kernel.kptr_restrict = 2"
      - "kernel.dmesg_restrict = 1"
      - "kernel.randomize_va_space = 2"
      - "kernel.sysrq = 0"
      - "fs.suid_dumpable = 0"
      - "net.ipv4.conf.all.accept_redirects = 0"
      - "net.ipv4.conf.all.send_redirects = 0"
      - "net.ipv4.conf.all.accept_source_route = 0"
      - "net.ipv4.conf.all.rp_filter = 1"
      - "net.ipv4.tcp_syncookies = 1"
      - "net.ipv4.conf.all.log_martians = 1"
      - "net.ipv4.ip_forward = 0"
      - "net.ipv6.conf.all.forwarding = 0"

# Verify the values are applied at runtime
command:
  sysctl_kptr:
    exec: sysctl -n kernel.kptr_restrict
    stdout:
      - "2"
  sysctl_dmesg:
    exec: sysctl -n kernel.dmesg_restrict
    stdout:
      - "1"
  sysctl_aslr:
    exec: sysctl -n kernel.randomize_va_space
    stdout:
      - "2"
  sysctl_sysrq:
    exec: sysctl -n kernel.sysrq
    stdout:
      - "0"
  sysctl_suid_dump:
    exec: sysctl -n fs.suid_dumpable
    stdout:
      - "0"
  sysctl_accept_redirects:
    exec: sysctl -n net.ipv4.conf.all.accept_redirects
    stdout:
      - "0"
  sysctl_rp_filter:
    exec: sysctl -n net.ipv4.conf.all.rp_filter
    stdout:
      - "1"
  sysctl_syncookies:
    exec: sysctl -n net.ipv4.tcp_syncookies
    stdout:
      - "1"
  sysctl_ip_forward:
    exec: sysctl -n net.ipv4.ip_forward
    stdout:
      - "0"
