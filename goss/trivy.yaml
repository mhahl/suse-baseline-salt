# Goss tests for baseline.trivy
#
# Schedule job names are asserted here (not in goss/schedule.yaml) so
# `make goss-schedule` after only baseline.schedule still passes.
# Use command greps rather than a second file: block on _schedule.conf —
# gossfile merges would shadow the schedule.yaml block for the same path.
# Overstate reads the same job (trivy-cve-scan) via schedule.list and the
# trivy.scan_summary mine key via its Mine tab — both names are stable.

file:
  /var/cache/trivy/report.json:
    exists: true
    mode: "0640"
    owner: root
    group: root
    title: "trivy vulnerability report exists with restricted perms"

command:
  "grep -q trivy-cve-scan /etc/salt/minion.d/_schedule.conf":
    exit-status: 0
    title: "trivy-cve-scan schedule is present"
  "grep -q trivy_scan.publish /etc/salt/minion.d/_schedule.conf":
    exit-status: 0
    title: "trivy_scan.publish is scheduled"
  "python3 -m json.tool /var/cache/trivy/report.json >/dev/null":
    exit-status: 0
    title: "trivy report is valid JSON"
  "grep -q 'persist: True' /etc/salt/minion.d/_schedule.conf":
    exit-status: 0
    title: "trivy schedule persists across restarts"
